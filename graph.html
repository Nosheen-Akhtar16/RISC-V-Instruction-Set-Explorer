
<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="font-family: Arial; text-align: center;">

  <h2>Top Extensions Distribution (Donut Chart)</h2>
  <canvas id="myChart" width="400" height="400"></canvas>

  <script>
    const labels = ["rv_v","rv_i","Others"];
    const counts = [627,37,679];

    new Chart(document.getElementById('myChart'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: counts,
          backgroundColor: [
            '#4CAF50',
            '#2196F3',
            '#FFC107'
          ]
        }]
      },
      options: {
        responsive: true,
        cutout: '60%', // 👈 donut hole size
        plugins: {
          legend: {
            position: 'bottom'
          }
        }
      }
    });
  </script>

</body>
</html>
