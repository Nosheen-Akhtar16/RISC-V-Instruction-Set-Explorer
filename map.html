<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>RISC-V Extensions Sharing Instructions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; text-align: center; }
        #graph { margin-top: 20px; border: 1px solid #ccc; background: #f9f9f9; padding: 20px; }
        a { color: #3498db; }
        .info { margin: 20px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/viz.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/full.render.js"></script>
</head>
<body>
    <h1>RISC-V Extensions That Share Instructions</h1>
    <p class="info">Each connection (edge) means the two extensions appear together in at least one instruction.</p>
    <div id="graph"></div>
    <p class="info">Generated by RISC-V Instruction Set Explorer (Tier 2 + Bonus)</p>
    <script>
        var viz = new Viz();
        var dot = "graph G {\n  layout=neato;\n  node [shape=box, style=filled, fillcolor=lightblue];\n  \"Zknd\" -- \"Zk\";\n  \"Zknd\" -- \"Zkn\";\n  \"Zknd\" -- \"Zkne\";\n  \"Zk\" -- \"Zkn\";\n  \"Zk\" -- \"Zkne\";\n  \"Zk\" -- \"Zbb\";\n  \"Zk\" -- \"Zks\";\n  \"Zk\" -- \"Zbkb\";\n  \"Zk\" -- \"Zbc\";\n  \"Zk\" -- \"Zbkc\";\n  \"Zk\" -- \"Zknh\";\n  \"Zk\" -- \"Zbkx\";\n  \"Zkn\" -- \"Zkne\";\n  \"Zkn\" -- \"Zbb\";\n  \"Zkn\" -- \"Zks\";\n  \"Zkn\" -- \"Zbkb\";\n  \"Zkn\" -- \"Zbc\";\n  \"Zkn\" -- \"Zbkc\";\n  \"Zkn\" -- \"Zknh\";\n  \"Zkn\" -- \"Zbkx\";\n  \"Zbb\" -- \"Zks\";\n  \"Zbb\" -- \"Zbkb\";\n  \"Zks\" -- \"Zbkb\";\n  \"Zks\" -- \"Zbc\";\n  \"Zks\" -- \"Zbkc\";\n  \"Zks\" -- \"Zksh\";\n  \"Zks\" -- \"Zksed\";\n  \"Zks\" -- \"Zbkx\";\n  \"Zbc\" -- \"Zbkc\";\n  \"Zvkned\" -- \"Zvkn\";\n  \"Zvkn\" -- \"Zvbb\";\n  \"Zvkn\" -- \"Zvks\";\n  \"Zvkn\" -- \"Zvknha\";\n  \"Zvkn\" -- \"Zvknhb\";\n  \"Zvbb\" -- \"Zvks\";\n  \"Zvks\" -- \"Zvksh\";\n  \"Zvks\" -- \"Zvksed\";\n  \"Zvknha\" -- \"Zvknhb\";\n}";
        viz.renderSVGElement(dot).then(function(element) {
            document.getElementById('graph').appendChild(element);
        }).catch(function(error) {
            console.error(error);
            document.getElementById('graph').innerHTML = '<p style="color:red">Error rendering graph: ' + error + '</p>';
        });
    </script>
</body>
</html>
